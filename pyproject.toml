[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "deltae-resource"
version = "2025.7.0"
description = "A modular framework for sub-national solar and land-based wind resource assessment."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = [
  "renewable-energy",
  "solar-energy",
  "wind-energy",
  "geospatial-analysis",
  "resource-assessment",
]
authors = [
  { name = "Md Eliasinul Islam", email = "eliasinul@gmail.com" },
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
]
dependencies = [
  "affine>=2.4",
  "atlite>=0.4",
  "cdsapi>=0.7.5",
  "cfgrib>=0.9.15",
  "cftime>=1.6",
  "click>=8.1",
  "colorama>=0.4",
  "dask>=2024.11",
  "eccodeslib>=2.44",
  "fiona>=1.10",
  "gdown>=6.1.0",
  "geojson>=3.1",
  "geopandas>=1.0",
  "h5py>=3.12",
  "matplotlib>=3.9",
  "netcdf4>=1.7",
  "numpy>=1.26",
  "openpyxl>=3.1",
  "osmnx>=2.0",
  "pandas>=2.2",
  "plotly>=5.24",
  "pygadm>=0.5.3",
  "pyogrio>=0.9",
  "pyproj>=3.6",
  "pyyaml>=6",
  "rasterio>=1.3",
  "requests>=2.32",
  "rioxarray>=0.17",
  "scikit-learn>=1.5",
  "scipy>=1.14",
  "seaborn>=0.13",
  "shapely>=2",
  "tables>=3.10",
  "tqdm>=4.66",
  "xarray>=2024.10",
  "xyzservices>=2024.9",
]

[project.optional-dependencies]
viz = [
  "bokeh>=3.5",
  "contextily>=1.6",
  "folium>=0.18",
  "holoviews>=1.19",
  "hvplot>=0.11",
]
notebooks = [
  "ipykernel>=6.29",
  "ipywidgets>=8.1",
  "jupyterlab>=4.2",
  "notebook>=7.2",
]
docs = [
  "folium>=0.18",
  "furo>=2024.8",
  "ipykernel>=6.29",
  "myst-parser>=4",
  "nbsphinx>=0.9",
  "sphinx>=8.1",
  "sphinx-book-theme>=1.1",
]
google-drive = [
    "dlt>=1.29,<2",
    "google-api-python-client>=2.100,<3",
]

[dependency-groups]
dev = [
  "build>=1",
  "coverage>=7.6",
  "mypy>=1.11",
  "pre-commit>=3.8",
  "pytest>=8.3",
  "pytest-cov>=6",
  "ruff>=0.9",
  "twine>=5",
]

[project.urls]
Homepage = "https://github.com/DeltaE/RESource"
Documentation = "https://deltae.github.io/RESource/"
Repository = "https://github.com/DeltaE/RESource"
Issues = "https://github.com/DeltaE/RESource/issues"
Publication = "https://doi.org/10.1016/j.energ.2026.100077"

[project.scripts]
resource = "RESource.cli:entrypoint"
resource-multiyear = "RESource.multiyear:entrypoint"
resource-cutout-multiyear = "RESource.cutout_multiyear:entrypoint"

[tool.setuptools.packages.find]
where = ["src"]
include = ["RESource*"]

[tool.setuptools.package-data]
RESource = [
  "assets/legends/*.csv",
  "assets/mappings/*.csv",
  "visual_styles/*.mplstyle",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["RES_backup", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = [
  "E501", # Ruff's formatter handles code wrapping; long prose is reviewed separately.
  "E402", # Several standalone data scripts intentionally defer optional imports.
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]

[tool.coverage.run]
source = ["RESource"]
branch = true
