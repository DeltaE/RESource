[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "RES"
version = "1.0"
description = "This tool standardizes the resource assessment framework for Renewable Energy resources. Currently support Solar and On-shore Wind resource assessments. Developed by Delta E+ Research Lab, Simon Fraser University, BC, CA"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Md Eliasinul Islam", email = "eliasinul@gmail.com" }
]

dependencies = [
    # Core scientific computing
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scipy>=1.14.0",
    "matplotlib>=3.9.0",
    
    # Geospatial & GIS
    "geopandas>=1.0.0",
    "rasterio>=1.3.0",
    "shapely>=2.0.0",
    "pyproj>=3.6.0",
    "fiona>=1.10.0",
    "rioxarray>=0.17.0",
    
    # Climate & earth system data
    "xarray>=2024.10.0",
    "netcdf4>=1.7.0",
    "cftime>=1.6.0",
    "atlite>=0.4.0",
    "cdsapi>=0.7.5",
    
    # Data processing & storage
    "h5py>=3.12.0",
    "dask>=2024.11.0",
    
    # Utilities
    "requests>=2.32.0",
    "pyyaml>=6.0.0",
    "tqdm>=4.66.0",
    "click>=8.1.0",
    
    # Additional geospatial tools
    "pygadm>=0.5.3",
    "pyogrio>=0.9.0",
]
classifiers = [
  "Programming Language :: Python :: 3.11",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent"
]

[project.urls]
Homepage = "https://github.com/yourusername/RES"  # Optional, update with your actual project URL

[project.scripts]
RES = "RES.cli:main"

[tool.setuptools.packages.find]
where = ["."]

[project.optional-dependencies]

# Visualization and interactive tools
viz = [
    "plotly>=5.24.0",
    "folium>=0.18.0", 
    "seaborn>=0.13.0",
    "bokeh>=3.5.0",
    "hvplot>=0.11.0",
    "holoviews>=1.19.0",
    "contextily>=1.6.0",
]

# Interactive computing
jupyter = [
    "jupyter>=1.1.0",
    "jupyterlab>=4.2.0",
    "ipywidgets>=8.1.0",
    "notebook>=7.2.0",
]

# Development tools
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "pytest-xdist>=3.5.0",
    "coverage>=7.6.0",
    "black>=24.0.0",
    "isort>=5.13.0", 
    "flake8>=7.0.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
    "twine>=5.0.0",
    "build>=1.0.0",
]

# Documentation 
docs = [
    "sphinx>=8.1.0",
    "myst-parser>=4.0.0",
    "furo>=2024.8.0",
    "sphinx-book-theme>=1.1.0",
    "nbsphinx>=0.9.0",
    "sphinx-autobuild>=2024.10.0",
    "ghp-import>=2.1.0",
    "ipykernel>=6.29.0",
    "jupyter>=1.1.0",
    "nbconvert>=7.16.0",
]

# Complete package (all optional dependencies)
all = [
    "RESource[viz,jupyter,dev,docs]",
]