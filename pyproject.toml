dependencies = [
    # Core scientific computing
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scipy>=1.14.0",
    "matplotlib>=3.9.0",
    
    # Geospatial & GIS
    "geopandas>=1.0.0",
    "rasterio>=1.3.0",
    "shapely>=2.0.0",
    "pyproj>=3.6.0",
    "fiona>=1.10.0",
    "rioxarray>=0.17.0",
    
    # Climate & earth system data
    "xarray>=2024.10.0",
    "netcdf4>=1.7.0",
    "cftime>=1.6.0",
    "atlite>=0.4.0",
    "cdsapi>=0.7.5",
    
    # Data processing & storage
    "h5py>=3.12.0",
    "dask>=2024.11.0",
    
    # Utilities
    "requests>=2.32.0",
    "pyyaml>=6.0.0",
    "tqdm>=4.66.0",
