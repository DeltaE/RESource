        buffer_mapping_key_buffers:
          # Buffer distances in meters for each aeroway type
          aerodrome: 100 # m
          runway: 100 # m
          taxiway: 100 # m
          helipad: 100 # m
          apron: 100 # m
          gate: 100 # m

  wind:
    vector_buffers:
    #list of dictionaries
    - aeroway:
        buffer_mapping_key: 'aeroway'
        buffer_mapping_key_buffers:
          # Buffer distances in meters for each aeroway type
          aerodrome: 100 # m
          runway: 100 # m
          taxiway: 100 # m
          helipad: 100 # m
          apron: 100 # m
          gate: 100 # m
