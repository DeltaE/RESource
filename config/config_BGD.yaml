    percentage_national_land_area: "9.0%"
    timezone_convert: 'Etc/GMT-6' # Bangladesh Standard Time (BST, GMT+6)
    GWA_country_code: 'BGD'
    CRS_meters: EPSG:32646

  'BD-02':
    name: "Chittagong"
    land_area_km2: 33,771
    percentage_national_land_area: "22.8%"
    timezone_convert: 'Etc/GMT-6'
    GWA_country_code: 'BGD'
    CRS_meters: EPSG:32646

  'BD-03':
    name: "Dhaka"
    land_area_km2: 20,594
    percentage_national_land_area: "13.9%"
    timezone_convert: 'Etc/GMT-6'
    GWA_country_code: 'BGD'
    CRS_meters: EPSG:32646

  'BD-04':
    name: "Khulna"
    land_area_km2: 22,272
    percentage_national_land_area: "15.1%"
    timezone_convert: 'Etc/GMT-6'
    GWA_country_code: 'BGD'
    CRS_meters: EPSG:32646

  'BD-05':
    name: "Mymensingh"
    land_area_km2: 10,584
    percentage_national_land_area: "7.2%"
    timezone_convert: 'Etc/GMT-6'
    GWA_country_code: 'BGD'
    CRS_meters: EPSG:32646

  'BD-06':
    name: "Rajshahi"
    land_area_km2: 18,174
    percentage_national_land_area: "12.3%"
    timezone_convert: 'Etc/GMT-6'
    GWA_country_code: 'BGD'
    CRS_meters: EPSG:32646

  'BD-07':
    name: "Rangpur"
    land_area_km2: 16,185
    percentage_national_land_area: "10.9%"
    timezone_convert: 'Etc/GMT-6'
    GWA_country_code: 'BGD'
    CRS_meters: EPSG:32646

