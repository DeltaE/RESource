Title: User Configuration for RESource Tool
Developer: Md Eliasinul Islam (Elias Islam)
Affiliation: Sustainable Energy Engineering, Simon Fraser University, BC, Canada
version: 1.0
Release_Year: 2025

Scenario:
  run_id: BASELINE
  Description: Baseline scenario with standard regulatory buffers around aeroways and conservation lands

country: Canada

default_CRS:
  degrees: EPSG:4326 # WGS 84; used for raw data storage and any processing steps that can be done in lat/lon without significant distortion;
  meters: EPSG:3347 # NAD83 / Statistics Canada Lambert;

weather_year: 2024 # calendar year to target for ERA5 cutout and associated timeseries; should be a recent year with typical weather patterns; used by AttributesParser.weather_year() property to derive cutout snapshot aligned to local midnight; also used in scenario naming for clear documentation of weather assumptions

economic_parameters:
  discount_rate: 0.07 # WACC; used to compute CRF for LCOE proxy

region_mapping:
  BC:
    name: British Columbia # Harmonized region name for consistent labeling across datasets; also harmonized with GADM and OSM naming conventions to facilitate data merging and comparisons
    land_area_km2: 925,186 # https://www150.statcan.gc.ca/t1/tbl1/en/tv.action?pid=1710000201
    percentage_national_land_area: 10.4% # BC land area as a percentage of total Canadian land area; calculated from BC and Canada land area values in Statistics Canada Table 17-10-0002-01
    timezone_convert: Etc/GMT+8
      # POSIX sign convention (counterintuitive): Etc/GMT+N means UTC−N, not UTC+N.
      # Etc/GMT+8 = UTC−8 = Pacific Standard Time (PST).
      # Used by AttributesParser.snapshot() property to align ERA5 cutout and associated timeseries to local midnight.
      # Do NOT use region names like 'America/Vancouver' here — those observe DST, which shifts the UTC offset seasonally and will misalign year boundaries.
    sub_region_mapping: {} # optional; only needed if sub-regional results are desired
    GWA_country_code: CAN # for GWA API queries; must be ISO 3166-1 alpha-3 code harmonized with GWA conventions
    CRS_meters: EPSG:3005 # BC Albers; used for all processing and analysis steps, including cutout retrieval, to avoid reprojection-induced distortions; must be harmonized with GWA CRS_meters for direct raster comparisons

  AB:
    name: Alberta
    land_area_km2: 642,317
    percentage_national_land_area: 7.1%
    timezone_convert: Etc/GMT-7
