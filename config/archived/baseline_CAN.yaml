GWA:
  root: data/downloaded_data/GWA
  datafields:
  - windspeed_gwa
  - CF_IEC2
  - CF_IEC3
  sources:
    windspeed_gwa: https://globalwindatlas.info/api/gis/country/GWA_country_code/wind-speed/100
    CF_IEC2: https://globalwindatlas.info/api/gis/country/GWA_country_code/capacity-factor_IEC2
    CF_IEC3: https://globalwindatlas.info/api/gis/country/GWA_country_code/capacity-factor_IEC3
    IEC_Class_ExLoads: https://globalwindatlas.info/api/gis/country/GWA_country_code/IEC-class-extreme-loads/
  rasters:
    windspeed_gwa: Canada_wspd_100m.tif
    CF_IEC2: CAN_capacity-factor_IEC2.tif
    CF_IEC3: CAN_capacity-factor_IEC3.tif
    IEC_Class_ExLoads: CAN.IEC-class-extreme-loads.tif
  filter:
    windspeed_low: 7
    windspeed_high: 40
capacity_disaggregation:

  solar:
    max_capacity: 5
    landuse_intensity: 1.45
    cost_data: data/processed_data/solar/utility_PV_Class7_cost_moderate_NREL_ATB2024.csv
    NREL_ATB_technology: UtilityPV
    NREL_ATB_type: Class7 # ATB UtilityPV Class 7 was selected as the closest proxy for BC's southern interior solar resource (annual GHI ≈ 4.8–5.2 kWh/m²/day); capacity factors are derived independently from ERA5 reanalysis and are not taken from ATB class-embedded assumptions
    atlite_panel: CSi
    tracking: dual
    operational_life: 25 # ATB UtilityPV operational life was selected as the closest proxy for BC's solar resource, which is predominantly a mix of older and newer panel models; this is a conservative assumption that may underestimate the potential of newer, longer-lived panels, but it provides a reasonable baseline for comparison
    cell_static_CF_tolerance: 0.16
    cell_capacity_tolerance: 1
    WCSS_tolerance: 0.03
    vector_buffers:
    - aeroway:
        buffer_mapping_key: aeroway
        buffer_mapping_key_buffers:
          aerodrome: 2000
          runway: 1500
          taxiway: 500
          helipad: 1000
          apron: 500
          gate: 500
    - conserved_lands:
        buffer_mapping_key: IUCN_CAT_desc
        buffer_mapping_key_buffers:
          Strict Nature Reserve: 1000
          Wilderness Area: 1000
          National Park: 1000
          Natural Monument or Feature: 500
          Habitat/Species Management Area: 500
          Protected Landscape/Seascape: 500
          Protected Area with Sustainable Use of Natural Resources: 500
          Interim Sites (unknown specifics): 500
          OECM areas: 100
  wind:
    max_capacity: 15
    landuse_intensity: 3
    cost_data: data/processed_data/wind/land_based_wind_T3_cost_moderate_NREL_ATB2024.csv
    WCSS_tolerance: 0.03
    CF_low: 0.2
    CF_high: 1
    NREL_ATB_technology: LandbasedWind
    operational_life: 20 # ATB LandbasedWind operational life was selected as the closest proxy for BC's wind resource, which is predominantly onshore and has a mix of older and newer turbine models; this is a conservative assumption that may underestimate the potential of newer, longer-lived turbines, but it provides a reasonable baseline for comparison
    turbines:
      NREL_ATB_type: Wind Turbine Technology 3
      atlite:
        1:
          name: Enercon_E82_3000kW
          ID: {}
          P: 3
        2:
          name: Vestas_V90_3MW
          ID: {}
          P: 3
      OEDB:
        source: https://openenergy-platform.org/api/v0/schema/supply/tables/wind_turbine_library/rows
        models:
          1:
            name: GE2.75_120
            ID: 116
            P: 2.75
            manufacturer: GE Wind
          2:
            name: 3.2M114_NES
            ID: 93
            P: 3.2
            manufacturer: Senvion/REpower
            config: data/downloaded_data/OEDB/3.2M114_NES.yaml
    vector_buffers:
    - aeroway:
        buffer_mapping_key: aeroway
        buffer_mapping_key_buffers:
          aerodrome: 5000
          runway: 3000
          taxiway: 500
          helipad: 1500
          apron: 1000
          gate: 1000
    - conserved_lands:
        buffer_mapping_key: IUCN_CAT_desc
        buffer_mapping_key_buffers:
          Strict Nature Reserve: 1000
          Wilderness Area: 1000
          National Park: 1000
          Natural Monument or Feature: 500
          Habitat/Species Management Area: 500
          Protected Landscape/Seascape: 500
          Protected Area with Sustainable Use of Natural Resources: 500
          Interim Sites (unknown specifics): 500
          OECM areas: 100
  transmission:
    grid_connection_cost_per_Km: 2.6
    tx_line_rebuild_cost: 0.56
    proximity_filter: 150 #km
    buses: data/processed_data/buses_BC.csv
    lines: data/processed_data/lines_BC.csv
