GWA:
  root: data/downloaded_data/GWA
  datafields:
  - windspeed_gwa
  - CF_IEC2
  - CF_IEC3
  sources:
    windspeed_gwa: https://globalwindatlas.info/api/gis/country/GWA_country_code/wind-speed/100
    CF_IEC2: https://globalwindatlas.info/api/gis/country/GWA_country_code/capacity-factor_IEC2
    CF_IEC3: https://globalwindatlas.info/api/gis/country/GWA_country_code/capacity-factor_IEC3
    IEC_Class_ExLoads: https://globalwindatlas.info/api/gis/country/GWA_country_code/IEC-class-extreme-loads/
  rasters:
    windspeed_gwa: Canada_wspd_100m.tif
    CF_IEC2: CAN_capacity-factor_IEC2.tif
    CF_IEC3: CAN_capacity-factor_IEC3.tif
    IEC_Class_ExLoads: CAN.IEC-class-extreme-loads.tif
  filter:
    windspeed_low: 7
    windspeed_high: 45
capacity_disaggregation:
  solar:
    max_capacity: 5
    landuse_intensity: 1.45
    cost_data: data/processed_data/solar/utility_PV_Class5_cost_moderate_NREL_ATB2024.csv
    NREL_ATB_technology: UtilityPV
    NREL_ATB_type: Class5
    atlite_panel: CSi
    tracking: dual
    cell_static_CF_tolerance: 0.16
    cell_capacity_tolerance: 1
    WCSS_tolerance: 0.0001
    vector_buffers:
    - aeroway:
        buffer_mapping_key: aeroway
        buffer_mapping_key_buffers:
          aerodrome: 0
          runway: 0
          taxiway: 0
          helipad: 0
          apron: 0
          gate: 0
    - conserved_lands:
        buffer_mapping_key: IUCN_CAT_desc
        buffer_mapping_key_buffers:
          Strict Nature Reserve: 0
          Wilderness Area: 0
          National Park: 0
          Natural Monument or Feature: 0
          Habitat/Species Management Area: 0
          Protected Landscape/Seascape: 0
          Protected Area with Sustainable Use of Natural Resources: 0
          Interim Sites (unknown specifics): 0
          OECM areas: 0
  wind:
    max_capacity: 15
    landuse_intensity: 3
    cost_data: data/processed_data/wind/land_based_wind_T3_cost_moderate_NREL_ATB2024.csv
    WCSS_tolerance: 0.0005
    CF_low: 0.2
    CF_high: 1
    NREL_ATB_technology: LandbasedWind
    turbines:
      NREL_ATB_type: Wind Turbine Technology 3
      atlite:
        1:
          name: Enercon_E82_3000kW
          ID: {}
          P: 3
        2':
          name: Vestas_V90_3MW
          ID: {}
          P: 3
      OEDB:
        source: https://openenergy-platform.org/api/v0/schema/supply/tables/wind_turbine_library/rows
        models:
          1:
            name: GE2.75_120
            ID: 116
            P: 2.75
            manufacturer: GE Wind
          2:
            name: 3.2M114_NES
            ID: 93
            P: 3.2
            manufacturer: Senvion/REpower
            config: data/downloaded_data/OEDB/3.2M114_NES.yaml
    vector_buffers:
    - aeroway:
        buffer_mapping_key: aeroway
        buffer_mapping_key_buffers:
          aerodrome: 0
          runway: 0
          taxiway: 0
          helipad: 0
          apron: 0
          gate: 0
    - conserved_lands:
        buffer_mapping_key: IUCN_CAT_desc
        buffer_mapping_key_buffers:
          Strict Nature Reserve: 0
          Wilderness Area: 0
          National Park: 0
          Natural Monument or Feature: 0
          Habitat/Species Management Area: 0
          Protected Landscape/Seascape: 0
          Protected Area with Sustainable Use of Natural Resources: 0
          Interim Sites (unknown specifics): 0
          OECM areas: 0
  bess:
    max_capacity: 10
    cost_data: data/processed_data/bess/bess_LI_6hr_cost_moderate_NREL_ATB2024.csv
    NREL_ATB_type: 6Hr Battery Storage
    vom: 0
    unit_size: 60
    residential_energy_consumption_year: 2021
    Based on general industry data and the needs of a region with a balanced energy mix like BC, you might consider the following approximate range: null
    capacity_estimate_per_energy_unit:
      Conservative: 0.01
      Moderate: 0.05
      Optimistic: 0.1
    storage_discharge_duration: 5.5
  transmission:
    grid_connection_cost_per_Km: 1.616
    tx_line_rebuild_cost: 0.348
    proximity_filter: 100
    buses: data/processed_data/buses.csv
    lines: data/processed_data/lines.csv
