GAEZ:
  root: data/downloaded_data/GAEZ
  self.: https://s3.eu-west-1.amazonaws.com/data.gaezdev.aws.fao.org/LR.zip
  zip_file: LR.zip
  Rasters_in_use_direct: Rasters_in_use
  raster_types:
  - name: exclusion_areas
    raster: exclusion_2017.tif
    zip_extract_direct: LR/excl
    color_map: OrRd
    stepwise_plot_title: Excluding Global Exclusion Areas
    class_exclusion:
      solar:
      - 2
      - 3
      - 4
      - 5
      - 6
      - 7
      wind:
      - 2
      - 3
      - 4
      - 5
      - 6
      - 7
      buffer:
        solar: 0
        wind: 0
  - name: terrain_resources
    raster: slpmed05.tif
    zip_extract_direct: LR/ter
    color_map: terrain
    stepwise_plot_title: Excluding Terrain Slope
    class_exclusion:
      solar:
      - 9
      wind:
      - 7
      - 8
      - 9
      buffer:
        solar: 0
        wind: 0
  - name: land_cover
    raster: faocmb_2010.tif
    zip_extract_direct: LR/lco
    color_map: YlGn
    stepwise_plot_title: Excluding not-Suitable Landcovers
    class_inclusion:
      solar:
      - 2
      - 3
      - 5
      - 8
      - 9
      wind:
      - 2
      - 3
      - 5
      - 8
      - 9
