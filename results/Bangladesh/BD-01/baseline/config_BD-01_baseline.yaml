GADM:
  root: data/downloaded_data/GADM
  processed: data/processed_data/regions
  admin_level: 1
  datafield_mapping:
    NAME_0: Country
    NAME_1: Division
NREL:
  ATB:
    root: data/downloaded_data/NREL/ATB
    source:
      csv: https://oedi-data-lake.s3.amazonaws.com/ATB/electricity/csv/2024/ATBe.csv
      parquet: https://oedi-data-lake.s3.amazonaws.com/ATB/electricity/parquet/2024/v3.0.0/ATBe.parquet
    datafile:
      csv: ATBe.csv
      parquet: ATBe.parquet
    about: https://atb.nrel.gov/electricity/2024/technologies
    column: core_metric_parameter
    cost_params:
      capex: OCC
      fom: Fixed O&M
      vom: None
OSM_data:
  root: data/downloaded_data/OSM
  data_keys:
    aeroway:
      tags:
      - aerodrome
      - runway
      - taxiway
      - helipad
      - apron
      - gate
    power:
      tags:
      - line
      - cable
      - minor_line
      - substation
      - tower
      - pole
      - generator
      - plant
      - terminal
    substation:
      tags:
      - transmission
      - distribution
      - minor_distribution
      - industrial
custom_land_layers:
  rasters:
    raster_1:
      raster: {}
      class_exclusion: {}
      buffer: {}
      invert: 'False'
  vectors:
    vector_1:
      geometry: {}
      buffer: null
      invert: 'False'
GAEZ:
  root: data/downloaded_data/GAEZ
  source: https://s3.eu-west-1.amazonaws.com/data.gaezdev.aws.fao.org/LR.zip
  zip_file: LR.zip
  Rasters_in_use_direct: Rasters_in_use
  raster_types:
  - name: exclusion_areas
    raster: exclusion_2017.tif
    zip_extract_direct: LR/excl
    color_map: OrRd
    stepwise_plot_title: Excluding Global Exclusion Areas
    class_exclusion:
      solar:
      - 2
      - 3
      - 4
      - 5
      - 6
      - 7
      wind:
      - 2
      - 3
      - 4
      - 5
      - 6
      - 7
      buffer:
        solar: 0
        wind: 0
  - name: terrain_resources
    raster: slpmed05.tif
    zip_extract_direct: LR/ter
    color_map: terrain
    stepwise_plot_title: Excluding Terrain Slope
    class_exclusion:
      solar:
      - 7
      - 8
      - 9
      wind:
      - 7
      - 8
      - 9
      buffer:
        solar: 0
        wind: 0
  - name: land_cover
    raster: faocmb_2010.tif
    zip_extract_direct: LR/lco
    color_map: YlGn
    stepwise_plot_title: Including Suitable Landcovers
    class_inclusion:
      solar:
      - 2
      - 3
      - 5
      - 6
      - 8
      - 9
      wind:
      - 2
      - 3
      - 5
      - 6
      - 8
      - 9
WorldPop:
  root: data/downloaded_data/WorldPop
  source:
    population_density_BGD: https://data.worldpop.org/GIS/Population_Density/Global_2000_2020_1km_UNadj/2020/BGD/bgd_pd_2020_1km_UNadj_ASCII_XYZ.zip
    population_count_BGD: https://data.worldpop.org/GIS/Population/Global_2000_2020_1km_UNadj/2020/BGD/bgd_ppp_2020_1km_UNadj_ASCII_XYZ.zip
cutout:
  root: data/downloaded_data/cutout/
  module:
  - era5
  dx: 0.25
  dy: 0.25
  snapshots:
    start:
    - '2023-01-01 00:00:00'
    end:
    - '2024-01-01 00:00:00'
GWA:
  root: data/downloaded_data/GWA
  datafields:
  - windspeed_gwa
  - CF_IEC3
  sources:
    windspeed_gwa: https://globalwindatlas.info/api/gis/country/GWA_country_code/wind-speed/100
    CF_IEC1: https://globalwindatlas.info/api/gis/country/GWA_country_code/capacity-factor_IEC1/
    CF_IEC2: https://globalwindatlas.info/api/gis/country/GWA_country_code/capacity-factor_IEC2
    CF_IEC3: https://globalwindatlas.info/api/gis/country/GWA_country_code/capacity-factor_IEC3
  rasters:
    windspeed_gwa: GWA_country_code_wspd_100m.tif
    CF_IEC1: GWA_country_code_capacity-factor_IEC1.tif
    CF_IEC2: GWA_country_code_capacity-factor_IEC2.tif
    CF_IEC3: GWA_country_code_capacity-factor_IEC3.tif
  filter:
    windspeed_low: 3
    windspeed_high: 70
capacity_disaggregation:
  solar:
    max_capacity: 5
    landuse_intensity: 1.45
    cost_data: data/processed_data/utility_PV_Class5_cost_moderate_NREL_ATB2024.csv
    NREL_ATB_technology: UtilityPV
    NREL_ATB_type: Class5
    atlite_panel: CSi
    tracking: horizontal
    cell_static_CF_tolerance: 0.16
    cell_capacity_tolerance: 1
    WCSS_tolerance: 0.08
    vector_buffers:
    - aeroway:
        buffer_mapping_key: aeroway
        buffer_mapping_key_buffers:
          aerodrome: 500
          runway: 500
          taxiway: 200
          helipad: 200
          apron: 200
          gate: 100
  wind:
    max_capacity: 3
    landuse_intensity: 2.5
    cost_data: data/processed_data/land_based_wind_T3_cost_moderate_NREL_ATB2024.csv
    WCSS_tolerance: 0.1
    CF_low: 0.15
    CF_high: 1
    NREL_ATB_technology: LandbasedWind
    turbines:
      NREL_ATB_type: Wind Turbine Technology 3
      atlite:
        1:
          name: Enercon_E82_3000kW
          ID: {}
          P: 3
        2:
          name: Vestas_V90_3MW
          ID: {}
          P: 3
      OEDB:
        source: https://openenergy-platform.org/api/v0/schema/supply/tables/wind_turbine_library/rows
        models:
          1:
            name: GE2.75_120
            ID: 116
            P: 2.75
            manufacturer: GE Wind
          2:
            name: 3.2M114_NES
            ID: 93
            P: 3.2
            manufacturer: Senvion/REpower
            config: data/downloaded_data/OEDB/3.2M114_NES.yaml
    vector_buffers:
    - aeroway:
        buffer_mapping_key: aeroway
        buffer_mapping_key_buffers:
          aerodrome: 1000
          runway: 1000
          taxiway: 500
          helipad: 500
          apron: 500
          gate: 200
  transmission:
    grid_connection_cost_per_Km: 2.8
    tx_line_rebuild_cost: 0.6
    proximity_filter: 150
