# RESource Production Environment
# Minimal, clean environment for production deployments
# Created: 2025-10-05

name: RESource-prod
channels:
- conda-forge
- defaults

dependencies:
# Core Python
- python=3.12
- pip

# Essential scientific computing
- numpy>=1.26.0
- pandas>=2.2.0
- scipy>=1.14.0
- matplotlib>=3.9.0

# Core geospatial packages
- geopandas>=1.0.0
- rasterio>=1.3.0
- shapely>=2.0.0
- pyproj>=3.6.0
- fiona>=1.10.0
- rioxarray>=0.17.0

# Climate data handling
- xarray>=2024.10.0
- netcdf4>=1.7.0
- cftime>=1.6.0

# Data storage
- h5py>=3.12.0
- pytables>=3.9.0

# Core utilities
- tqdm>=4.66.0
- requests>=2.32.0
- pyyaml>=6.0.0
- click>=8.1.0

# Pip packages
- pip:
  - "atlite>=0.4.0"
  - "cdsapi>=0.7.5"
  - "pygadm>=0.5.3"
  - "pyogrio>=0.9.0"
  - "-e ."
