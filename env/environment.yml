# RESource Environment Configuration
# Clean, reproducible environment for Renewable Energy Resource Assessment
# Created: 2025-10-05
# Python Version: 3.12 (recommended for best performance and compatibility)

name: RESource
channels:
- conda-forge
- defaults

dependencies:
# =============================================================================
# CORE PYTHON ENVIRONMENT
# =============================================================================
- python=3.12
- pip

# =============================================================================
# SCIENTIFIC COMPUTING CORE
# =============================================================================
- numpy>=1.26.0
- pandas>=2.2.0
- scipy>=1.14.0
- matplotlib>=3.9.0
- seaborn>=0.13.0

# =============================================================================
# GEOSPATIAL & GIS PACKAGES
# =============================================================================
- geopandas>=1.0.0
- rasterio>=1.3.0
- shapely>=2.0.0
- pyproj>=3.6.0
- fiona>=1.10.0
- rioxarray>=0.17.0
- contextily>=1.6.0

# =============================================================================
# CLIMATE & EARTH SYSTEM DATA
# =============================================================================
- xarray>=2024.10.0
- netcdf4>=1.7.0
- cftime>=1.6.0

# =============================================================================
# DATA PROCESSING & STORAGE
# =============================================================================
- h5py>=3.12.0
- pytables>=3.9.0
- dask>=2024.11.0
- dask-geopandas>=0.4.0

# =============================================================================
# INTERACTIVE VISUALIZATION
# =============================================================================
- plotly>=5.24.0
- folium>=0.18.0
- bokeh>=3.5.0
- hvplot>=0.11.0
- holoviews>=1.19.0

# =============================================================================
# MACHINE LEARNING & CLUSTERING
# =============================================================================
- scikit-learn>=1.5.0

# =============================================================================
# JUPYTER ECOSYSTEM
# =============================================================================
- jupyter>=1.1.0
- jupyterlab>=4.2.0
- ipywidgets>=8.1.0
- notebook>=7.2.0

# =============================================================================
# UTILITIES & HELPERS
# =============================================================================
- tqdm>=4.66.0
- requests>=2.32.0
- pyyaml>=6.0.0
- click>=8.1.0
- colorama>=0.4.6

# =============================================================================
# DEVELOPMENT & TESTING (Optional)
# =============================================================================
- pytest>=8.3.0
- pytest-cov>=6.0.0

# =============================================================================
# PIP-ONLY PACKAGES
# =============================================================================
- pip:
  # Energy system modeling and climate data access
  - "atlite>=0.4.0"
  - "cdsapi>=0.7.5"

  # Enhanced geospatial tools
  - "cartopy>=0.23.0"
  - "pyogrio>=0.9.0"
  - "pygadm>=0.5.3"
  - "osmnx>=1.9.0"
  - "geojson>=3.1.0"

  # Additional utilities
  - "ipython>=8.28.0"

  # RESource package (editable install)
  - "-e ."

# =============================================================================
# USAGE INSTRUCTIONS
# =============================================================================
#
# 1. Create the environment:
#    conda env create -f env/environment.yml
#
# 2. Activate the environment:
#    conda activate RESource
#
# 3. Verify installation:
#    python -c "import RES; print('RESource installed successfully!')"
#
# 4. Update environment (when changes are made to this file):
#    conda env update -f env/environment.yml --prune
#
# 5. Export current environment (for sharing exact versions):
#    conda env export > environment_locked.yml
# =============================================================================
