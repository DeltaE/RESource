<svg xmlns="http://www.w3.org/2000/svg" viewBox="-162 -162 324 324" role="img" aria-label="Loading" xmlns:c2pa="http://c2pa.org/manifest">
<!-- RESource loader. Author: EL. Outer cells light up clockwise; centre turbine spins. Loops every 1.4s. -->
<style>
.o{transform-box:fill-box;transform-origin:50% 50%;animation:wave 1.4s cubic-bezier(.45,0,.25,1) infinite}
@keyframes wave{0%,100%{opacity:.28;transform:scale(.86)}22%{opacity:1;transform:scale(1)}50%{opacity:.28;transform:scale(.86)}}
.c{animation:breathe 1.4s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
.rot{transform-box:fill-box;transform-origin:50% 50%;animation:spin 1.4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.o,.c,.rot{animation:none}.o{opacity:.7}}
</style>
